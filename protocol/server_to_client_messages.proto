syntax = "proto3";

option go_package = "gen/greyvarprotocol";

package greyvarproto;

message ServerUpdate {
	repeated EntityPosition entityPositions = 2;
	repeated EntitySpawn entitySpawns = 3;
	PlayerJoined playerJoined = 4;
	Tile singleTileChange = 5;
	Grid grid = 6;
	ConnectionResponse connectionResponse = 7;
	repeated EntityDefinition entityDefinitions = 8;
	repeated EntityStateChange entityStateChanges = 9;
	repeated int64 entityDespawns = 10;
	WorldListResponse worldListResponse = 11;
	ConsoleMessage consoleMessage = 12;
	HudMessage hudMessage = 13;
	InventoryUpdate inventoryUpdate = 14;
	repeated ItemDefinition itemDefinitions = 15;
	repeated RecipeDefinition recipeDefinitions = 16;
	repeated EntityAppearanceChange entityAppearanceChanges = 17;
	repeated TileChange tileChanges = 18;
	Dialog dialog = 19;
}

// One step of a conversation with an NPC: show text and options; the client
// answers with a DialogChoiceRequest.
message Dialog {
	int64 entityId = 1;
	string node = 2;
	string speaker = 3;
	string text = 4;
	repeated DialogOption options = 5;
}

message DialogOption {
	string label = 1;
	// Picking it ends the conversation (no next node).
	bool ends = 2;
	// Look change it applies (layer -> variant or slot -> palette), so the
	// client can preview it while the option is focused.
	map<string, string> wear = 3;
}

// A live change to a server-owned grid layer (e.g. "crops"). An unset tile
// clears the cell.
message TileChange {
	string layer = 1;
	uint32 row = 2;
	uint32 col = 3;
	Tile tile = 4;
}

message EntityPosition {
	int64 entityId = 1;
	int32 x = 2; 
	int32 y = 3;
}

message EntityStateChange {
	int64 entityId = 1;
	string newState = 2;
}

message EntitySpawn {
	int64 entityId = 1;
	int32 x = 2;
	int32 y = 3;
	int32 w = 4;
	int32 h = 5;
	uint32 primaryColor = 7;
	string definition = 9;
	string initialState = 10;
	// Layered-rig look (players). Unset for entities without a rig.
	Appearance appearance = 11;
	// Text shown under the entity in the world (the Tiled object's "label"
	// property, e.g. where a teleport pad goes). Empty for none.
	string label = 12;
}

// Look of a layered sprite rig (res/sprites/<rig>). Keys and values are names
// from the rig's rig.json; unknown values fall back to the rig defaults.
message Appearance {
	// layer -> variant, e.g. hair -> short
	map<string, string> parts = 1;
	// colour slot -> palette, e.g. skin -> tan
	map<string, string> palettes = 2;
	// itemdef name drawn at the pose's hand anchor; empty for none
	string heldItem = 3;
	// character size, i.e. which rig draws it: "adult" or "child"
	string rig = 4;
}

message EntityAppearanceChange {
	int64 entityId = 1;
	Appearance appearance = 2;
}

message EntityDefinition {
	string name = 1;
	repeated EntityState states = 3;
	string texture = 4;
	// Frame size of the entity tileset (most are 15px, newer ones 16px).
	int32 tileWidth = 5;
	int32 tileHeight = 6;
	// Walked onto (doors, teleport pads, pressure buttons): drawn beneath
	// characters instead of with them.
	bool floor = 7;
	// How close (px, Chebyshev) a player must be to interact; 0 = default 24.
	// Larger for NPCs behind a counter (Herman).
	int32 interactRange = 8;
}

message EntityState {
	string name = 1;
	repeated int32 frames = 2;
	// Optional hold duration in milliseconds for each frame (parallel to frames).
	// A zero or missing entry uses the client's default playback rate for that frame.
	repeated int32 holds = 3;
	// Tile-local collision shapes from the entity tileset (same as map tile collision).
	repeated CollisionRect collision = 4;
	// Play the animation once and hold its last frame (tile property loop=false),
	// e.g. a chest opening. Default (false) loops.
	bool once = 5;
}

message PlayerQuit {
	int64 playerId = 1;
}

message PlayerAlreadyHere {
	int64 playerId = 1; 
}

message PlayerJoined {
	string username = 1;
	int64 entityId = 2;
}

message PlayerYou {
	int64 playerId = 1; 
}

message CollisionRect {
	float x = 1;
	float y = 2;
	float w = 3;
	float h = 4;
}

message Tile {
	uint32 col = 1;
	uint32 row = 2;
	string tex = 3;
	bool flipH = 4;
	bool flipV = 5;
	int32 rot = 6;
	string atlasKey = 7;
	int32 frameIndex = 8;
	repeated CollisionRect collision = 9;
	bool collisionFromTsx = 10;
	// Draw the tile's still image even if its tileset animates it (e.g. a
	// see-through sand shore over grass: the tide only plays over water).
	bool still = 11;
	// Decor (e.g. flowers) has no collision of its own; an overlay (e.g. a
	// generated cliff face) adds its collision to the tile beneath. The
	// client mirrors the server's collision rule for the debug overlay.
	bool decor = 12;
	bool overlay = 13;
	// Draw over characters (e.g. a tree's canopy).
	bool above = 14;
}

message Tileset {
	string key = 1;
	string image = 2;
	uint32 tileWidth = 3;
	uint32 tileHeight = 4;
	uint32 columns = 5;
	// Tiled <animation>s: tiles in this tileset that animate on the client.
	repeated TileAnimation animations = 6;
}

message TileAnimation {
	// Local tile id that is placed in maps.
	int32 tileId = 1;
	// Frames as local tile ids, with a duration per frame (parallel arrays).
	repeated int32 frames = 2;
	repeated int32 durationsMs = 3;
	// Run in step in every cell (water); otherwise each cell starts on its own frame.
	bool synced = 4;
}

message GridLayer {
	string name = 1;
	string kind = 2;
	repeated Tile tiles = 3;
}

message GridTransition {
	string fromGridId = 1;
	int32 scrollDeltaX = 2;
	int32 scrollDeltaY = 3;
}

message Grid {
	string title = 1;
	repeated Tile tiles = 2;
	uint32 rowCount = 3;
	uint32 colCount = 4;
	string gridId = 5;
	string worldId = 6;
	repeated Tileset tilesets = 7;
	GridTransition transition = 8;
	repeated GridLayer layers = 9;
}

message ConnectionResponse {
	string serverVersion = 1;
	repeated PlayerAlreadyHere playerAlreadyHere = 5;
}

message WorldSummary {
	string worldId = 1;
	string title = 2;
	uint32 gridCount = 3;
	string spawnGrid = 4;
}

message WorldListResponse {
	repeated WorldSummary worlds = 1;
}

message ConsoleMessage {
	string text = 1;
}

// On-screen floating prompt (signs, item pickup, etc.). Empty text clears.
// entityId anchors the box near that entity in world space when non-zero.
message HudMessage {
	string text = 1;
	int64 entityId = 2;
	// Sticky messages stay until the server replaces or clears them (a sign
	// while you stand at it). Others (pickups, harvests, "locked") fade out
	// on the client after a few seconds.
	bool sticky = 3;
}

message InventoryItem {
	string definition = 1;
	int32 count = 2;
}

message InventoryUpdate {
	repeated InventoryItem items = 1;
}

message ItemDefinition {
	string id = 1;
	string title = 2;
	int32 stackMax = 3;
	string category = 4;
	// Optional in-hand sprite (path under /res/) and the pixel that sits on the hand.
	string heldSprite = 5;
	int32 heldGripX = 6;
	int32 heldGripY = 7;
	// Inventory/HUD picture (path under /res/); empty for none.
	string icon = 8;
}

message RecipeInput {
	string item = 1;
	int32 count = 2;
}

message RecipeOutput {
	string item = 1;
	int32 count = 2;
}

message RecipeDefinition {
	string id = 1;
	string title = 2;
	repeated RecipeInput inputs = 3;
	repeated RecipeOutput outputs = 4;
}

message NoResponse {}
