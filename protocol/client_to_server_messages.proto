syntax = "proto3";

option go_package = "gen/greyvarprotocol";

package greyvarproto;

message ClientRequests {
	RegistrationRequest registrationRequest = 1;
	MoveRequest moveRequest = 2;
	WorldListRequest worldListRequest = 3;
	WorldLoadRequest worldLoadRequest = 4;
	InteractRequest interactRequest = 5;
	CraftRequest craftRequest = 6;
	WorldReloadRequest worldReloadRequest = 7;
	AppearanceRequest appearanceRequest = 8;
}

message MoveRequest {
	int32 playerId = 1;
	int32 x = 2;
	int32 y = 3;
}

message ConnectionRequest {
}

message RegistrationRequest {	
	string username = 1;
}

message WorldListRequest {}

message WorldLoadRequest {
	string worldId = 1;
}

// Mine, break, or otherwise harvest a world entity (e.g. pot).
message InteractRequest {
	int64 entityId = 1;
}

message CraftRequest {
	string recipeId = 1;
}

// Reload a world from disk. Empty worldId reloads the player's current world.
message WorldReloadRequest {
	string worldId = 1;
}

// Change the requesting player's look. Only the given keys change; the server
// validates names against the player rig and rejects unknown ones.
message AppearanceRequest {
	map<string, string> parts = 1;
	map<string, string> palettes = 2;
	// Set to change the held item; "-" clears it.
	string heldItem = 3;
}
