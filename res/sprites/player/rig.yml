defaults:
  palettes:
    hair: brown
    pants: charcoal
    shirt: magenta
    skin: rose
    garment: blue
    trim: white
  parts:
    hair: short
    pants: default
    outfit: none
# Collision box [x, y, w, h] in frame pixels: the side-view body is x 4..11,
# so walls are touched from every side (the whole 16px frame left 4px gaps).
hitbox: [4, 0, 8, 16]
outputs:
  sheetsDir: ../../img/textures/entities/player
  composite: ../../img/textures/entities/player/composite.png
  tsx: ../../../server/dat/entdefs/player.tsx
  webRoot: ../..
