    red: ['#6e1418', '#b02a2a', '#e05a48']
    pink: ['#a0105a', '#ff3fa8', '#ff9fd8']
    blue: ['#1f4a8a', '#4a8ad8', '#9ac4f0']
    green: ['#26703a', '#58b868', '#a0e0a0']
  form:
    plaster: ['#5c5852', '#a8a197', '#c4bdb2', '#ddd7cd']
    linen: ['#6a5a3e', '#c8b48c', '#d8c6a0', '#ece0c2']
# Palettes only data uses: never picked for a new player's random look.
hidden:
  skin: [mannequin]
defaults:
  palettes:
    form: plaster
    garment: purple
    hair: brown
    pants: denim
    shirt: magenta
    skin: rose
    trim: gold
  parts:
    beard: none
    form: none
    hair: short
    outfit: none
    pants: default
# Collision box [x, y, w, h] in the character's 16px cell (its feet): the
# same footprint as the child rig, so doors and corridors work unchanged.
hitbox: [4, 0, 8, 16]
outputs:
  sheetsDir: ../../img/textures/entities/adult
  composite: ../../img/textures/entities/adult/composite.png
  webRoot: ../..
