# The adult size: about 1.5 tiles tall (a 27px figure) on 33px frames,
# colliding with the same one-tile footprint at its feet as the child rig
# (res/sprites/player). Parts come from PixelLab character states whose
# palette is locked to the slot keys below (source/<state>/): run
# `python3 res/sprites/adult/source/assemble.py` then `make sprites` (see the
# docstring there). Do not edit parts/, poses.yml or clips.yml by hand.
name: adult
size: adult
# Odd frame (33x33) so the frame has a true centre column and row (x = 16):
# the figure is centred on it, as entities use 15/31 px canvases for the
# same reason (res/ART_RULES.md). The anchor is the feet: centre column, and
# the row below the soles.
frameSize: 33
columns: 8
anchor: [16, 32]
layers:
  - name: pants
    variants:
      - default
  - name: body
    variants: []
  - name: form
    # A mannequin's faceless figure over the body (its silhouette in the form
    # colours), under the clothes; `none` (the default) draws nothing.
    variants:
      - none
      - mannequin
  - name: shirt
    variants: []
  - name: outfit
    # One-piece outfits drawn over the shirt, trousers and limbs below the
    # neck; `none` (the default) draws nothing.
    variants:
      - none
      - dress
  - name: beard
    # Drawn in the hair colours.
    variants:
      - none
      - beard
  - name: hair
    # bald is empty: the body layer has a full (bald) head under every style.
    variants:
      - short
      - long
      - ponytail
      - bun
      - curly
      - bob
      - bald
slots:
  # Key ramps, dark -> light. Skin, hair and shirt match the child rig; the
  # trouser keys are blue so they never mix with the outline when the
  # PixelLab frames are split into layers.
  skin:
    - '#935968'
    - '#eba5a0'
    - '#f3aea6'
    - '#f3cebe'
  hair:
    - '#3e282b'
    - '#4e2c29'
    - '#613a41'
  shirt:
    - '#3b1a34'
    - '#851667'
    - '#a61684'
    - '#c42f95'
  pants:
    - '#1e2a5e'
    - '#2e3e86'
    - '#4a5ea8'
  # Outfit colours (as the child rig): the garment's ramp and a trim.
  garment:
    - '#20183a'
    - '#3a2c66'
    - '#54428e'
    - '#7262b6'
  trim:
    - '#5a4a10'
    - '#a88a2a'
    - '#e8cc66'
  # Mannequin figure (form layer).
  form:
    - '#5c5852'
    - '#a8a197'
    - '#c4bdb2'
    - '#ddd7cd'
slotOrder:
  - skin
  - hair
  - shirt
  - pants
  - garment
  - trim
  - form
fixed:
  - '#151215'
  - '#1f1a1f'
palettes:
  # Each palette replaces its slot's key ramp, dark -> light, same length.
  skin:
    rose: ['#935968', '#eba5a0', '#f3aea6', '#f3cebe']
    peach: ['#a8695a', '#f0b48c', '#f6c29c', '#fde0c4']
    tan: ['#7a4a32', '#b97a54', '#c98b62', '#e0a982']
    brown: ['#4f2e22', '#8a5638', '#9a6442', '#b8835e']
    deep: ['#2e1a14', '#5c3a2a', '#6a4532', '#8a6248']
    mannequin: ['#5c5852', '#a8a197', '#c4bdb2', '#ddd7cd']
  hair:
    brown: ['#3e282b', '#4e2c29', '#613a41']
    black: ['#1c1a24', '#2a2733', '#3d3a4a']
    blonde: ['#a07434', '#d6a94a', '#f0d27a']
